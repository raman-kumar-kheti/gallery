version: "3.9"

services:
  # ─────────────────────────────────────────────
  # PostgreSQL
  # ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: gallery_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gallery}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gallery_secret}
      POSTGRES_DB: ${POSTGRES_DB:-gallery_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gallery}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  # Redis
  # ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: gallery_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  # Backend API (FastAPI)
  # ─────────────────────────────────────────────
  backend:
    build:
      context: ./apps/backend-api
      dockerfile: Dockerfile
    container_name: gallery_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-gallery}:${POSTGRES_PASSWORD:-gallery_secret}@postgres:5432/${POSTGRES_DB:-gallery_db}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/backend-api:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ─────────────────────────────────────────────
  # AI Worker (Celery)
  # ─────────────────────────────────────────────
  ai-worker:
    build:
      context: ./apps/ai-worker
      dockerfile: Dockerfile
    container_name: gallery_ai_worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-gallery}:${POSTGRES_PASSWORD:-gallery_secret}@postgres:5432/${POSTGRES_DB:-gallery_db}
      REDIS_URL: redis://redis:6379/0
      FAISS_INDEX_DIR: /app/indexes
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/ai-worker:/app
      - faiss_indexes:/app/indexes
    command: celery -A worker.celery_app worker --loglevel=info --concurrency=2 -Q ai_processing

  # ─────────────────────────────────────────────
  # Celery Flower (monitoring)
  # ─────────────────────────────────────────────
  flower:
    image: mher/flower:2.0
    container_name: gallery_flower
    restart: unless-stopped
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      FLOWER_PORT: 5555
    ports:
      - "5555:5555"
    depends_on:
      - redis

  # ─────────────────────────────────────────────
  # Frontend (Next.js)
  # ─────────────────────────────────────────────
  frontend:
    build:
      context: ./apps/frontend-web
      dockerfile: Dockerfile
    container_name: gallery_frontend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./apps/frontend-web:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev

volumes:
  postgres_data:
  faiss_indexes:
